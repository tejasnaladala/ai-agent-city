[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-city"
version = "0.1.0"
description = "Seed-reproducible agent-based civilization simulator with modular economy and world models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.5",
]
[project.scripts]
agent-city = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*", "examples", "examples.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
